name: Docker Image

permissions:
  contents: read

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to qualify or publish, e.g. v0.1.0-preview."
        required: true
        default: "v0.1.0-preview"
        type: string
      publish_image:
        description: "Push the qualified image to GHCR. Leave off for build-only validation."
        required: true
        default: false
        type: boolean
      publish_latest:
        description: "Also publish ghcr.io/aipowergrid/validator:latest."
        required: true
        default: false
        type: boolean

env:
  IMAGE_NAME: ghcr.io/aipowergrid/validator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and classify image tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
            args+=(--publish-latest-if-stable)
          else
            tag="$INPUT_TAG"
            publish="$PUBLISH_IMAGE"
            if [[ "$PUBLISH_LATEST" == "true" && "$publish" != "true" ]]; then
              echo "error: publish_latest requires publish_image" >&2
              exit 1
            fi
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              args+=(--publish-latest)
            fi
          fi
          ./scripts/classify-release-tag.sh "${args[@]}" "$tag" >> "$GITHUB_OUTPUT"
          echo "publish_image=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: ${{ steps.release.outputs.publish_image == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      - name: Build local smoke image
        run: docker build -t aipowergrid/validator:publish-smoke .

      - name: Smoke-test local image
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/.env" <<'EOF'
          GRID_API_URL=http://127.0.0.1:1
          VALIDATOR_API_KEY=grid-key
          VALIDATOR_WALLET=0x19e7e376e7c213b7e7e7e46cc70a5dd086daff2a
          VALIDATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111
          VALIDATOR_REQUIRE_STAKE=false
          PROBE_TIMEOUT_S=1
          EOF
          set +e
          docker run --rm \
            --mount type=bind,source="$tmp/.env",target=/app/.env,readonly \
            aipowergrid/validator:publish-smoke check --no-probe > "$tmp/check.out" 2>&1
          code=$?
          set -e
          cat "$tmp/check.out"
          test "$code" -eq 1
          if grep -Ei "Traceback|ModuleNotFoundError|ImportError" "$tmp/check.out"; then
            exit 1
          fi
          grep -F "Validator registration failed" "$tmp/check.out"

      - name: Build multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.release.outputs.publish_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest container provenance
        if: ${{ steps.release.outputs.publish_image == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
