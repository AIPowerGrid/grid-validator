name: Docker Image

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to qualify without publishing, e.g. v0.1.0-preview."
        required: true
        default: "v0.1.0-preview"
        type: string

env:
  IMAGE_NAME: ghcr.io/aipowergrid/validator

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.release.outputs.latest }}
      publish_image: ${{ steps.release.outputs.publish_image }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and classify image tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
            args+=(--publish-latest-if-stable)
          else
            tag="$INPUT_TAG"
            publish=false
          fi
          if [[ "$publish" == "true" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "error: container release commit must be reachable from reviewed master" >&2
              exit 1
            fi
            if [[ "$EVENT_NAME" != "push" || "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "error: container publication requires a protected v* tag push" >&2
              exit 1
            fi
          fi
          ./scripts/classify-release-tag.sh "${args[@]}" "$tag" >> "$GITHUB_OUTPUT"
          echo "publish_image=$publish" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify container image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}

      - name: Build local smoke image
        run: |
          docker build \
            --build-arg AIPG_VALIDATOR_RELEASE_TAG='${{ needs.validate.outputs.tag }}' \
            -t aipowergrid/validator:publish-smoke .

      - name: Smoke-test local image
        shell: bash
        run: |
          version="$(docker run --rm aipowergrid/validator:publish-smoke --version)"
          test "$version" = "aipg-validator ${{ needs.validate.outputs.tag }}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/.env" <<'EOF'
          GRID_API_URL=http://127.0.0.1:1
          VALIDATOR_API_KEY=grid-key
          VALIDATOR_WALLET=0x19e7e376e7c213b7e7e7e46cc70a5dd086daff2a
          VALIDATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111
          VALIDATOR_REQUIRE_STAKE=false
          PROBE_TIMEOUT_S=1
          EOF
          set +e
          docker run --rm \
            --mount type=bind,source="$tmp/.env",target=/app/.env,readonly \
            aipowergrid/validator:publish-smoke check --no-probe > "$tmp/check.out" 2>&1
          code=$?
          set -e
          cat "$tmp/check.out"
          test "$code" -eq 1
          if grep -Ei "Traceback|ModuleNotFoundError|ImportError" "$tmp/check.out"; then
            exit 1
          fi
          grep -F "text.token_limit.v1" "$tmp/check.out"
          grep -F "Validator registration failed" "$tmp/check.out"

      - name: Build multi-architecture image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AIPG_VALIDATOR_RELEASE_TAG=${{ needs.validate.outputs.tag }}
          provenance: mode=max
          sbom: true

  publish:
    name: Publish protected container image
    if: ${{ needs.validate.outputs.publish_image == 'true' }}
    needs: [validate, qualify]
    runs-on: ubuntu-latest
    environment: validator-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.latest == 'true' }}

      - name: Build and publish multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AIPG_VALIDATOR_RELEASE_TAG=${{ needs.validate.outputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
