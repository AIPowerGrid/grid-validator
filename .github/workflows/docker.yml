name: Docker Image

permissions:
  contents: read

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish for a manual run, e.g. v0.1.0-canary."
        required: true
        default: "v0.1.0-canary"
        type: string
      publish_latest:
        description: "Also publish ghcr.io/aipowergrid/validator:latest."
        required: true
        default: false
        type: boolean

env:
  IMAGE_NAME: ghcr.io/aipowergrid/validator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate and classify image tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            args+=(--publish-latest-if-stable)
          else
            tag="$INPUT_TAG"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              args+=(--publish-latest)
            fi
          fi
          ./scripts/classify-release-tag.sh "${args[@]}" "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      - name: Build local smoke image
        run: docker build -t aipowergrid/validator:publish-smoke .

      - name: Smoke-test local image
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/.env" <<'EOF'
          GRID_API_URL=http://127.0.0.1:1
          VALIDATOR_API_KEY=grid-key
          VALIDATOR_WALLET=0x19e7e376e7c213b7e7e7e46cc70a5dd086daff2a
          VALIDATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111
          VALIDATOR_REQUIRE_STAKE=false
          PROBE_TIMEOUT_S=1
          EOF
          set +e
          docker run --rm \
            --mount type=bind,source="$tmp/.env",target=/app/.env,readonly \
            aipowergrid/validator:publish-smoke check --no-probe > "$tmp/check.out" 2>&1
          code=$?
          set -e
          cat "$tmp/check.out"
          test "$code" -eq 1
          if grep -Ei "Traceback|ModuleNotFoundError|ImportError" "$tmp/check.out"; then
            exit 1
          fi
          grep -F "Validator registration failed" "$tmp/check.out"

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
