name: Release Binaries

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish, e.g. v0.1.0-preview. Leave blank to build artifacts only."
        required: false
        type: string
      prerelease:
        description: "Mark manually published release as a prerelease."
        required: true
        default: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and classify release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--allow-empty)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" && "$INPUT_PRERELEASE" == "true" ]]; then
            args+=(--force-prerelease)
          fi
          ./scripts/classify-release-tag.sh "${args[@]}" "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: macos-14
            asset: macos-arm64
          - os: windows-latest
            asset: windows-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked release dependencies
        run: uv sync --frozen --extra release --python 3.11

      - name: Build binary
        run: uv run --frozen --extra release pyinstaller --onefile --name aipg-validator --specpath build/pyinstaller validator/__main__.py

      - name: Smoke-test binary
        shell: bash
        run: |
          BIN="dist/aipg-validator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="dist/aipg-validator.exe"
          fi
          PYTHONIOENCODING=cp1252 "$BIN" --help
          BIN_ABS="$(pwd)/$BIN"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/.env" <<'EOF'
          GRID_API_URL=http://127.0.0.1:1
          VALIDATOR_API_KEY=grid-key
          VALIDATOR_WALLET=0x19e7e376e7c213b7e7e7e46cc70a5dd086daff2a
          VALIDATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111
          VALIDATOR_REQUIRE_STAKE=false
          PROBE_TIMEOUT_S=1
          EOF
          set +e
          (
            cd "$tmp"
            PYTHONIOENCODING=cp1252 "$BIN_ABS" check --no-probe
          ) > "$tmp/check.out" 2>&1
          code=$?
          set -e
          cat "$tmp/check.out"
          test "$code" -eq 1
          if grep -Ei "Traceback|ModuleNotFoundError|ImportError" "$tmp/check.out"; then
            exit 1
          fi
          grep -F "text.token_limit.v1" "$tmp/check.out"
          grep -F "Validator registration failed" "$tmp/check.out"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist-artifacts/package
          BIN="dist/aipg-validator"
          OUT="aipg-validator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="dist/aipg-validator.exe"
            OUT="aipg-validator.exe"
          fi
          cp "$BIN" "dist-artifacts/package/$OUT"
          (
            cd dist-artifacts/package
            python -m zipfile -c "../aipg-validator-${{ matrix.asset }}.zip" "$OUT"
          )
          python -m zipfile -l "dist-artifacts/aipg-validator-${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aipg-validator-${{ matrix.asset }}
          path: dist-artifacts/*.zip
          if-no-files-found: error

  bundle:
    name: Assemble verified release payload
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist-artifacts/aipg-validator-release.spdx.json
          artifact-name: aipg-validator-release-sbom

      - name: Package verified installer
        shell: bash
        run: install -m 0755 scripts/install-binary.sh dist-artifacts/install-validator.sh

      - name: Generate release identity and SHA-256 manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path("dist-artifacts")
          names = [
              "aipg-validator-linux-x64.zip",
              "aipg-validator-linux-arm64.zip",
              "aipg-validator-macos-arm64.zip",
              "aipg-validator-windows-x64.zip",
              "aipg-validator-release.spdx.json",
              "install-validator.sh",
          ]
          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          version = project["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag and not re.fullmatch(
              rf"v{re.escape(version)}(?:-(?:preview|alpha|beta|rc)(?:\.[0-9]+)?)?",
              tag,
          ):
              raise SystemExit("release tag does not match project version")

          assets = []
          for name in names:
              path = root / name
              assets.append({
                  "name": name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              })
          manifest = {
              "schema": "aipg-validator-release-v1",
              "tag": tag,
              "version": version,
              "commit": os.environ["RELEASE_COMMIT"],
              "assets": assets,
          }
          (root / "validator-release.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          checksummed = [*names, "validator-release.json"]
          lines = [
              f"{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}"
              for name in checksummed
          ]
          (root / "SHA256SUMS").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
          )
          PY

      - name: Verify complete release payload
        run: ./scripts/verify-release-assets.sh dist-artifacts

      - name: Upload verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aipg-validator-release-payload
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ needs.validate.outputs.publish == 'true' }}
    needs: [validate, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aipg-validator-release-payload
          path: dist-artifacts

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist-artifacts/SHA256SUMS

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist-artifacts/*.zip
            dist-artifacts/*.spdx.json
            dist-artifacts/validator-release.json
            dist-artifacts/install-validator.sh
            dist-artifacts/SHA256SUMS
