name: Release Binaries

permissions:
  contents: read

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish, e.g. v0.1.0-preview. Leave blank to build artifacts only."
        required: false
        type: string
      prerelease:
        description: "Mark manually published release as a prerelease."
        required: true
        default: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate and classify release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--allow-empty)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" && "$INPUT_PRERELEASE" == "true" ]]; then
            args+=(--force-prerelease)
          fi
          ./scripts/classify-release-tag.sh "${args[@]}" "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: macos-14
            asset: macos-arm64
          - os: windows-latest
            asset: windows-x64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked release dependencies
        run: uv sync --frozen --extra release --python 3.11

      - name: Build binary
        run: uv run --frozen --extra release pyinstaller --onefile --name aipg-validator --specpath build/pyinstaller validator/__main__.py

      - name: Smoke-test binary
        shell: bash
        run: |
          BIN="dist/aipg-validator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="dist/aipg-validator.exe"
          fi
          PYTHONIOENCODING=cp1252 "$BIN" --help
          BIN_ABS="$(pwd)/$BIN"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/.env" <<'EOF'
          GRID_API_URL=http://127.0.0.1:1
          VALIDATOR_API_KEY=grid-key
          VALIDATOR_WALLET=0x19e7e376e7c213b7e7e7e46cc70a5dd086daff2a
          VALIDATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111
          VALIDATOR_REQUIRE_STAKE=false
          PROBE_TIMEOUT_S=1
          EOF
          set +e
          (
            cd "$tmp"
            PYTHONIOENCODING=cp1252 "$BIN_ABS" check --no-probe
          ) > "$tmp/check.out" 2>&1
          code=$?
          set -e
          cat "$tmp/check.out"
          test "$code" -eq 1
          if grep -Ei "Traceback|ModuleNotFoundError|ImportError" "$tmp/check.out"; then
            exit 1
          fi
          grep -F "Validator registration failed" "$tmp/check.out"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist-artifacts/package
          BIN="dist/aipg-validator"
          OUT="aipg-validator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="dist/aipg-validator.exe"
            OUT="aipg-validator.exe"
          fi
          cp "$BIN" "dist-artifacts/package/$OUT"
          (
            cd dist-artifacts/package
            python -m zipfile -c "../aipg-validator-${{ matrix.asset }}.zip" "$OUT"
          )
          python -m zipfile -l "dist-artifacts/aipg-validator-${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aipg-validator-${{ matrix.asset }}
          path: dist-artifacts/*.zip
          if-no-files-found: error

  release:
    if: ${{ needs.validate.outputs.publish == 'true' }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist-artifacts/aipg-validator-release.spdx.json
          artifact-name: aipg-validator-release-sbom

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd dist-artifacts
          files=( *.zip *.spdx.json )
          sha256sum -- "${files[@]}" > SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist-artifacts/SHA256SUMS

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist-artifacts/*.zip
            dist-artifacts/*.spdx.json
            dist-artifacts/SHA256SUMS
